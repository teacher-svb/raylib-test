services:
  raylib-app:
    build: .
    image: raylib-dev
    container_name: raylib_developer
    user: "${UID}:${GID}"
    
    environment:
      - DISPLAY=${DISPLAY}
      # WSLg uses WAYLAND_DISPLAY, Arch uses DISPLAY (XWayland)
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY}
      - XDG_RUNTIME_DIR=/tmp
      - DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${UID}/bus
      # Needed for audio on both systems
      - PULSE_SERVER=unix:/run/user/${UID}/pulse/native

    volumes:
      - ./project:/workspace
      # --- Graphics Sockets (Arch/Linux) ---
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /run/user/${UID}/bus:/run/user/${UID}/bus
      # --- WSLg Sockets (Windows) ---
      # Docker will ignore these if they don't exist on Arch
      - /mnt/wslg:/mnt/wslg
      # --- System/Identity ---
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro
      
    devices:
      # Hardware acceleration for Arch (Windows handles this via /mnt/wslg)
      - /dev/dri:/dev/dri
      
    ipc: host
    network_mode: host
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash